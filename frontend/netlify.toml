[build]
  publish = "dist"
  command = "npm run build"

# SPA routing fallback to index.html for client-side React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and permission headers configuration
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "geolocation=(self)"
